# ── 기본 설정 ────────────────────────────────────────────
base_model: /workspace/model
tokenizer_config: /workspace/model
special_tokens:
  pad_token: "<|end_of_text|>"
dataset_prepared_path: /workspace/cache/48gb_cache
output_dir: /workspace/final-result/48gb/out-expensive-48gb-v1
seed: 100

# ── 모델 로드 및 어댑터 설정 ──────────────────────────────
adapter: qlora
load_in_4bit: true
load_in_8bit: false

# ── 하드웨어 및 커널 설정 ─────────────────────────────────
bf16: true
tf32: true
flash_attention: true
lora_qkv_kernel: false
lora_o_kernel: false
lora_mlp_kernel: false
lora_embedding_kernel: false

# ── LoRA 설정 ─────────────────────────────────────────────
lora_r: 64
lora_alpha: 16
lora_dropout: 0.05
lora_target_linear: true

# ── 시퀀스 및 배치 설정 ───────────────────────────────────
sequence_len: 20480
pad_to_sequence_len: true
sample_packing: false
micro_batch_size: 1
gradient_accumulation_steps: 16
eval_batch_size: 1

# ── 학습 설정 ─────────────────────────────────────────────
max_steps: 20
learning_rate: 0.0002
optimizer: adamw_torch_fused
train_on_inputs: false
max_grad_norm: 1.0

# ── 데이터셋 설정 ─────────────────────────────────────────
datasets:
  - path: synthetic
    type: _synthetic
    length: 320
    sequence_length: 20480

# ── 체크포인팅 ────────────────────────────────────────────
gradient_checkpointing: true
